name: UTVN CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Static Analysis, Invariant & TypeScript Validation
  # -------------------------------------------------------------
  validate:
    name: Lint & Typecheck (CI)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript & Schema Invariants
        run: npm run lint

  # -------------------------------------------------------------
  # Job 2: Production Bundle Compilation
  # -------------------------------------------------------------
  build:
    name: Production Build & Asset Packaging
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets (Vite)
        run: npm run build
        env:
          NODE_ENV: production
          VITE_CONFIG_NATIVE_IGNORE_WARNING: 'true'

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html || { echo "Build artifact dist/index.html missing!"; exit 1; }
          echo "Build integrity verified successfully."

      - name: Upload Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: utvn-dist-bundle
          path: dist/
          retention-days: 14

      - name: Setup GitHub Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to gh-pages Branch (Alternative Branch Host)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  # -------------------------------------------------------------
  # Job 3: Continuous Deployment (GitHub Pages)
  # -------------------------------------------------------------
  deploy-pages:
    name: Deploy to GitHub Pages (CD)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # -------------------------------------------------------------
  # Job 4: Release Automation (Triggered on Version Tags)
  # -------------------------------------------------------------
  release:
    name: GitHub Release Package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: utvn-dist-bundle
          path: dist

      - name: Archive Production Assets
        run: |
          cd dist && tar -czvf ../utvn-dist-${{ github.ref_name }}.tar.gz *

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: utvn-dist-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
